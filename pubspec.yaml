name: alkheir_mosque
description: "البوابة التعليمية - مسجد الخير"
publish_to: 'none'

version: 1.0.0+2

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Networking
  dio: ^5.11.1
  retrofit: ">=4.1.0 <4.5.0"
  pretty_dio_logger: ^1.4.0

  # Navigation
  go_router: ^14.8.1

  # Storage
  shared_preferences: ^2.5.6
  flutter_secure_storage: ^9.2.4

  # Forms
  form_builder_validators: ^11.1.2

  # Core Services & Utilities
  url_launcher: ^6.3.1
  package_info_plus: ^8.2.2

  # Data & Serialization
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Existing UI & utilities
  percent_indicator: ^4.2.3
  fl_chart: ^0.69.0
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  flutter_animate: ^4.5.0
  mobile_scanner: ^6.0.11
  file_picker: ^11.0.3
  open_filex: ^4.7.0
  path_provider: ^2.1.6
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.14
  riverpod_generator: ^2.6.3
  retrofit_generator: ^9.1.9
  freezed: ^2.5.7
  json_serializable: ^6.9.4

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/logo/

  # خط الهوية (Dubai) — نفس الخط المستخدم في الموقع
  fonts:
    - family: Dubai
      fonts:
        - asset: assets/fonts/Dubai-Light.ttf
          weight: 300
        - asset: assets/fonts/Dubai-Regular.ttf
          weight: 400
        - asset: assets/fonts/Dubai-Medium.ttf
          weight: 500
        - asset: assets/fonts/Dubai-Bold.ttf
          weight: 700
