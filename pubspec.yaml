name: alkheir_mosque
description: "البوابة التعليمية - مسجد الخير"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  flutter_localizations:
    sdk: flutter
  intl: 0.20.3
  percent_indicator: ^4.2.3
  fl_chart: ^0.69.0
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  flutter_animate: ^4.5.0
  shared_preferences: ^2.3.3
  mobile_scanner: ^6.0.11
  flutter_riverpod: ^2.6.1
  file_picker: ^13.1.0
  open_filex: ^4.7.0
  path_provider: ^2.1.6
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/logo/

  # خط الهوية (Dubai) — نفس الخط المستخدم في الموقع
  fonts:
    - family: Dubai
      fonts:
        - asset: assets/fonts/Dubai-Light.ttf
          weight: 300
        - asset: assets/fonts/Dubai-Regular.ttf
          weight: 400
        - asset: assets/fonts/Dubai-Medium.ttf
          weight: 500
        - asset: assets/fonts/Dubai-Bold.ttf
          weight: 700
